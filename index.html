.recipe-img {

  width: 100%;

  margin-bottom: 10px;
}

label{display:block;margin:12px 0;font-weight:600}label.i{font-weight:400;display:inline-flex;gap:6px;margin:4px 12px 4px 0;align-items:center}

hist:()=>{const dias=new Set(S.hist.map(h=>h.data)).size;return`<h2>Atividades</h2><p class="sub">${S.hist.length?`Você registrou atividades em ${dias} dia(s). Bom trabalho em cuidar da sua rotina!`:"Aqui ficam as receitas que você experimentar e as refeições concluídas."}</p>${S.hist.map((h,k)=>`<div class="meal"><span>${h.tipo==="experimentada"?"Experimentada":"Refeição concluída"}: <b>${esc(byId(h.rid)?.nome)}</b> <small>(${h.data})</small></span><button class="link" data-a="hrm" data-id="${k}">Excluir</button></div>`).join("")}<p>Favoritas: ${S.favs.length}</p>`},
priv:()=>`<h2>Privacidade</h2><p>Coletamos apenas as respostas do questionário para sugerir receitas. Você pode editá-las no painel.</p><p>${S.demo?"No modo demonstração os dados ficam só neste navegador.":"Seus dados ficam vinculados à sua conta e protegidos por regras de acesso por usuário."}</p><button data-a="wipe">Excluir meus dados</button><p class="note">A exclusão da conta de acesso (login) exige configuração adicional no servidor, descrita no README. Esta aplicação não foi auditada para conformidade com a LGPD.</p>`};
function render(){let v=location.hash.slice(1)||"home";const prot=["quest","painel","receitas","plano","compras","fav","hist"];
 if(prot.includes(v)&&!logged())v="entrar";else if(["painel","plano"].includes(v)&&!S.prefs)v="quest";
 $("#nav").innerHTML=logged()?[["painel","Painel"],["receitas","Receitas"],["plano","Plano"],["compras","Compras"],["fav","Favoritas"],["hist","Atividades"],["priv","Privacidade"]].map(x=>`<button class="link" data-a="go" data-id="${x[0]}">${x[1]}</button>`).join("")+`<button class="link" data-a="out">Sair</button>`:`<button class="link" data-a="go" data-id="entrar">Entrar</button>`;
 $("#app").innerHTML=V[v]();if(v==="receitas")grid();window.scrollTo(0,0)}
function grid(){const q=norm($("#q").value),c=$("#c").value,t=+$("#t").value,f=$("#f").checked;
 const rs=R.filter(r=>(!q||norm(r.nome+" "+r.ingredientes.join(" ")).includes(q))&&(!c||r.categoria===c)&&(!t||r.tempo<=t)&&(!f||S.favs.includes(r.id)));
 $("#grid").innerHTML=rs.length?rs.map(card).join(""):`<p class="empty">Nenhuma receita encontrada. Ajuste a busca ou os filtros.</p>`;$("#cnt").textContent=`${rs.length} de ${R.length} receitas`}
const go=h=>location.hash.slice(1)===h?render():location.hash=h;
const addShop=r=>{r.ingredientes.forEach(t=>{if(!S.shop.some(i=>norm(i.t)===norm(t)))S.shop.push({t,ok:false})})};
const hist=(rid,tipo)=>{S.hist.push({rid:+rid,tipo,data:new Date().toISOString().slice(0,10)});persist()};
function modal(id){const r=byId(id),f=S.favs.includes(r.id);$("#dlg").innerHTML=`<h2>${esc(r.nome)}</h2>
${r.imagem
  ? `<img class="recipe-img" src="${esc(r.imagem)}" alt="${esc(r.nome)}">`
  : `<div class="ph">Imagem ilustrativa não disponível</div>`}
<p>${esc(r.categoria)} · ${esc(r.tempo_texto)} · ${esc(r.rendimento)}</p><h3>Ingredientes</h3><ul>${r.ingredientes.map(i=>`<li>${esc(i)}</li>`).join("")}</ul><h3>Modo de preparo</h3><ol>${r.preparo.map(i=>`<li>${esc(i)}</li>`).join("")}</ol>${r.alergenos.length?`<p class="note">Possíveis alérgenos (por palavras-chave): ${r.alergenos.map(a=>AL.find(x=>x[0]==a)[1]).join(", ")}. Confira rótulos e contaminação cruzada.</p>`:""}<div class="row"><button class="p" data-a="fav" data-id="${r.id}">${f?"Remover dos favoritos":"Favoritar"}</button><button data-a="shopadd" data-id="${r.id}">Adicionar à lista de compras</button><button data-a="tried" data-id="${r.id}">Marcar como experimentada</button><button class="link" data-a="close">Fechar</button></div>`;if(!$("#dlg").open)$("#dlg").showModal()}
function qCollect(){const f=$("#qf"),d=new FormData(f);for(const[k]of d)if(!["dias","preparo","alergias","ciente"].includes(k))Q[k]=d.get(k);
 f.querySelectorAll("input[type=checkbox]").forEach(e=>Q[e.name]=d.getAll(e.name));Q.ciente=Q.ciente&&Q.ciente.length?1:Q.ciente}
async function qNext(){qCollect();
 const bad=REQ[qs].filter(k=>!(Array.isArray(Q[k])?Q[k].length:Q[k]));if(bad.length){$("#qe").textContent=bad.includes("ciente")?"Confirme que entendeu o uso dos dados.":"Preencha os campos obrigatórios para continuar.";return}
 if(qs<4){qs++;return render()}
 S.prefs={...Q,refeicoes:+Q.refeicoes,tempo:+Q.tempo};delete S.prefs.ciente;S.plan=null;await persist();go("painel")}
const A={go:id=>go(id),demo(){S.demo=true;const d=JSON.parse(localStorage.getItem("e360_demo")||"{}");S.prefs=d.prefs||null;S.favs=d.favs||[];go(S.prefs?"painel":"quest")},
 signup(){S.mode="signup";go("entrar")},mode(id){S.mode=id;render()},
 
async auth(){
  if(!sb)return;
  const modo=S.mode;
  const e=$("#em").value.trim().toLowerCase();
  const p=$("#pw")?.value;

  if(!e||(modo!=="reset"&&!p))
    return toast("Preencha e-mail e senha.",1);

  const r=modo==="signup"
    ?await sb.auth.signUp({email:e,password:p})
    :modo==="reset"
      ?await sb.auth.resetPasswordForEmail(e)
      :await sb.auth.signInWithPassword({email:e,password:p});

  if(r.error)
    return toast("Não foi possível concluir. Verifique os dados e tente novamente.",1);

  if(modo==="reset"){
    toast("Se o e-mail existir, enviaremos o link de recuperação.");
    return;
  }

  if(modo==="signup"&&!r.data.session){
    toast("Conta criada! Confirme seu e-mail e depois entre na sua conta.");
    return;
  }

  const usuario=r.data.user;
  if(!usuario)
    return toast("Não foi possível identificar sua conta.",1);

  try{
    const {data,error}=await sb.functions.invoke("resgatar-acesso");
    if(error)console.error("Erro ao verificar compra:",error);
    else console.log("Resultado da compra:",data);
  }catch(erro){
    console.error("Falha ao verificar compra:",erro);
  }

  await setUser(usuario);

  if(S.acesso){
    toast("Acesso verificado com sucesso!");
    go(S.prefs?"painel":"quest");
  }else{
    go("entrar");
  }
},

 async out(){if(sb&&S.user)await sb.auth.signOut();S={...S,user:null,demo:false,acesso:null,prefs:null,favs:[]};go("home")},
 qnext:qNext,qback(){qCollect();qs--;render()},edit(){Q={...S.prefs,refeicoes:String(S.prefs.refeicoes),tempo:String(S.prefs.tempo)};qs=0;go("quest")},
 gerar(){gerar();render()},dia(id){S.dia=+id;render()},plist(){S.lista=!S.lista;render()},print(){window.print()},
 sub(id){const[k,i]=id.split("|"),m=S.plan.dias[k][i],used={};Object.values(S.plan.dias).flat().forEach(x=>x.id&&(used[x.id]=(used[x.id]||0)+1));const r=pick(m.slot,[m.id],used);if(!r)return toast("Não há outra receita compatível para esta refeição.",1);m.id=r.id;m.done=false;persist();render()},
 pdone(id){const[k,i]=id.split("|"),m=S.plan.dias[k][i];m.done=!m.done;if(m.done)hist(m.id,"concluida");persist();render()},
 pshop(){Object.values(S.plan.dias).flat().forEach(m=>m.id&&addShop(byId(m.id)));persist();toast("Ingredientes adicionados à lista de compras.")},
 open:id=>modal(id),close:()=>$("#dlg").close(),
 async fav(id){id=+id;const has=S.favs.includes(id);S.favs=has?S.favs.filter(x=>x!==id):[...S.favs,id];
  if(!S.demo&&sb&&S.user){const q=sb.from("favoritos"),{error}=has?await q.delete().match({user_id:S.user.id,receita_id:id}):await q.insert({user_id:S.user.id,receita_id:id});if(error)toast("Não foi possível salvar o favorito.",1)}else persist();modal(id);if($("#grid"))grid();if(location.hash==="#fav")render()},
 shopadd(id){addShop(byId(id));persist();toast("Ingredientes adicionados à lista.")},tried(id){hist(id,"experimentada");toast("Registrado nas suas atividades.")},
 add(){const v=$("#ni").value.trim();if(!v)return;S.shop.push({t:v,ok:false});persist();render()},buy(id){S.shop[id].ok=!S.shop[id].ok;persist();render()},rm(id){S.shop.splice(id,1);persist();render()},
 clear(){if(confirm("Limpar toda a lista de compras?")){S.shop=[];persist();render()}},
 async share(){const t=S.shop.map(i=>(i.ok?"[x] ":"[ ] ")+i.t).join("\n");try{if(navigator.share)await navigator.share({title:"Lista de compras",text:t});else{await navigator.clipboard.writeText(t);toast("Lista copiada.")}}catch{}},
 hrm(id){if(confirm("Excluir este registro?")){S.hist.splice(id,1);persist();render()}},
 async wipe(){if(!confirm("Excluir suas preferências, favoritos e registros? Esta ação não pode ser desfeita."))return;
  if(sb&&S.user){await sb.from("favoritos").delete().eq("user_id",S.user.id);await sb.from("preferencias").delete().eq("user_id",S.user.id);await sb.from("atividades").delete().eq("user_id",S.user.id);await sb.from("planejamentos").delete().eq("user_id",S.user.id)}
  localStorage.removeItem("e360_local");localStorage.removeItem("e360_demo");S={...S,prefs:null,favs:[],plan:null,shop:[],hist:[]};toast("Dados excluídos.");go("home")}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&b.type!=="checkbox")A[b.dataset.a]?.(b.dataset.id)});
document.addEventListener("change",e=>{if(e.target.dataset.a==="buy")A.buy(e.target.dataset.id)});
document.addEventListener("input",e=>{if(["q","c","t","f"].includes(e.target.id))grid()});
addEventListener("hashchange",render);
(async()=>{if(sb){const{data}=await sb.auth.getSession();await setUser(data.session?.user)}render()})();
</script></body></html>
